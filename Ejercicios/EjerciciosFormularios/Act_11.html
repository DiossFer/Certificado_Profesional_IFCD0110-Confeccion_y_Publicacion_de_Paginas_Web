<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Actividad Formularios 11">

    <meta name="description" content="Fernando de Dios Ortega Castro">

    <title>Actividad_Formularios_11</title>

    <link rel="stylesheet" href="Act_11.css">

</head>

<body>
    <form id="Formulario_11" name="Formulario_11" method="post" action="#">
        <h2>Formulario Actividad 11</h2><br>
    
        <fieldset>

            <legend><strong>Completar</strong></legend><br>


            <textarea rows="4" cols="52" placeholder="Utilice este cuadro para escribir"></textarea>   

            <br><br>

            <label for="fecha">Elija una fecha:&nbsp;<br><input type="date" name="fecha"></label>

            <br><br>

            <label for="color">Elija un color:&nbsp;&nbsp;&nbsp;&nbsp;<input type="color" name="color"></label>

            <br><br>

            <div id="conector">
                <input type="checkbox" name="conector" value="conectorusb">USB <br>
                <input type="checkbox" name="conector" value="conectorparalelo" >Paralelo <br>
                <input type="checkbox" name="conector" value="conectorps2" >PS2 <br>
            </div>

            <br>
            
            <select id="aula" name="aula">
                <option value="a01">A01</option>
                <option value="a02">A02</option>
                <option value="a03">A03</option>
            </select>

            <br><br>

            <label for="fichero">Elija un fichero:&nbsp;<br><input type="file" name="fichero" ></label>

            <br><br>

            <label for="nombre">Nombre<br><input type="text" name="nombre"></label><br><br>

            <label for="apellidos">Apellidos<br><input type="text" name="apellidos"></label><br><br>

            <label for="direccion">Dirección<br><input type="text" name="direccion"></label><br>

        </fieldset>
        

    </form>
</body>

</html>
