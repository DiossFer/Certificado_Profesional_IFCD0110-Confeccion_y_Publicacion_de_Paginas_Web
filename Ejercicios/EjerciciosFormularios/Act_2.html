<body>
    <form id="Formulario_2" name="Formulario_2" method="post" action="#">
        <h2>Formulario Actividad 2</h2><br>

            <div id="procesador">

            </div>

            <br>


        </fieldset>

        <br><br>
        
        <fieldset>
