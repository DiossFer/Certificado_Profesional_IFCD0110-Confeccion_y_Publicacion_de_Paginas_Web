<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Actividad Formularios 14">

    <meta name="description" content="Fernando de Dios Ortega Castro">

    <title>Actividad_Formularios_14</title>

    <link rel="stylesheet" href="Act_14.css">

</head>

<body>
    <form id="Formulario_14" name="Formulario_14" method="post" action="#">
        <h2>Formulario Actividad 14</h2><br>
    
        <fieldset>

            <legend><strong>Preferencias</strong></legend><br>

            <label for="hora">Elija una hora:&nbsp;<br><input type="time" name="hora"></label>

            <br><br>

            <label for="color">Elija un color:&nbsp;&nbsp;&nbsp;&nbsp;<input type="color" name="color"></label>

            <br><br>

            <label for="instituto">Instituto&nbsp;&nbsp;<input type="text" name="instituto"></label><br><br>

            <label for="estudios">Estudios elegidos&nbsp;&nbsp;<input type="text" name="estudios"></label><br><br>

            <label for="nombre">Nombre&nbsp;&nbsp;<input type="text" name="nombre"></label><br><br>

            <label for="apellidos">Apellidos&nbsp;&nbsp;<input type="text" name="apellidos"></label><br><br>

            <label for="email">Email&nbsp;&nbsp;<input type="email" name="email"></label><br>

            <br>

            <select name="idioma" id="idioma" multiple="multiple" size="4">

                <option value="ingles">Inglés</option>
                <option value="aleman">Alemán</option>
                <option value="frances">Francés</option>

            </select>

            <br><br>

            <label for="fichero">Elija un fichero:&nbsp;<br><input type="file" name="fichero"></label>

            <br><br>

            <textarea rows="13" cols="53" placeholder="Utilice este cuadro para escribir"></textarea>   

            <br><br>

            <div id="procesador">
                <input type="checkbox" name="procesador" value="procesadoramd">AMD&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <input type="checkbox" name="procesador" value="procesadorintel_i5" >Intel i5&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <input type="checkbox" name="procesador" value="procesadorintel_i7" >Intel i7&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            </div>

            <br><br>

            <label for="fecha">Elija una fecha:&nbsp;<br><input type="date" name="fecha"></label>

            <br>
            
        </fieldset>
        

    </form>
</body>

</html>
