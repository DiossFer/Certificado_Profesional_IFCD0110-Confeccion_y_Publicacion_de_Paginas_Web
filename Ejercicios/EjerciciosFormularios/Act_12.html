<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Actividad Formularios 12">

    <meta name="description" content="Fernando de Dios Ortega Castro">

    <title>Actividad_Formularios_12</title>

    <link rel="stylesheet" href="Act_12.css">

</head>

<body>
    <form id="Formulario_12" name="Formulario_12" method="post" action="#">
        <h2>Formulario Actividad 12</h2><br>
    
        <fieldset>

            <legend><strong>Rellenar</strong></legend><br>

            <select id="sexo_1" name="sexo_1">

                <option value="hombre">Hombre</option>
                
                <option value="mujer">Mujer</option>

            </select>

            <br><br>

            <label for="color">Elija un color:&nbsp;&nbsp;&nbsp;&nbsp;<input type="color" name="color"></label>

            <br><br>

            <label for="fecha">Elija una fecha:&nbsp;<br><input type="date" name="fecha"></label>

            <br><br>

            <div id="lenguaje">

                <input type="radio" name="lenguaje" value="python">Python</input>
                <input type="radio" name="lenguaje" value="html">HTML</input>
                <input type="radio" name="lenguaje" value="visual">Visual Basic</input>
                <input type="radio" name="lenguaje" value="java">Java</input>

            </div>

            <br><br>

            <div id="sexo">

                <input type="checkbox" name="sexo_1" id="sexo_1" value="sexohombre">&nbsp;Hombre&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

                <input type="checkbox" name="sexo_1" id="sexo_2" value="sexomujer">&nbsp;Mujer

            </div>

            <br><br>

            <label for="fichero">Elija un fichero:&nbsp;<br><input type="file" name="fichero" ></label>

            <br><br>

            <textarea rows="8" cols="60" placeholder="Utilice este cuadro para escribir"></textarea>   

            <br><br>

            <label for="instituto">Instituto&nbsp;&nbsp;<input type="text" name="instituto"></label><br><br>

            <label for="estudios">Estudios elegidos&nbsp;&nbsp;<input type="text" name="estudios"></label><br><br>

            <label for="nombre">Nombre&nbsp;&nbsp;<input type="text" name="nombre"></label><br><br>

            <label for="apellidos">Apellidos&nbsp;&nbsp;<input type="text" name="apellidos"></label><br><br>

            <label for="email">Email&nbsp;&nbsp;<input type="email" name="email"></label><br>

            
        </fieldset>

        <br><br>

        <fieldset>

            <legend><strong>Rellene las opciones siguientes</strong></legend><br>

            <div id="sistema">

                <input type="checkbox" name="sistema" id="sistema" value="sistemawindows">&nbsp;Windows&nbsp;&nbsp;

                <input type="checkbox" name="sistema" id="sistema" value="sistemamac">&nbsp;Mac&nbsp;&nbsp;
                <input type="checkbox" name="sistema" id="sistema" value="sistemalinux">&nbsp;Linux&nbsp;&nbsp;

            </div>

            <br><br>

            <label for="hora">Elija una hora:&nbsp;<br><input type="time" name="hora"></label>

            <br><br>

            <div id="procesador">
                <input type="radio" name="procesador" value="procesadoramd">AMD&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <input type="radio" name="procesador" value="procesadorintel_i5" >Intel i5&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <input type="radio" name="procesador" value="procesadorintel_i7" >Intel i7&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            </div>

            <br><br>

            <label for="fichero">Elija un fichero:&nbsp;<br><input type="file" name="fichero" ></label>

            <br>
            
        </fieldset>
        

    </form>
</body>

</html>
