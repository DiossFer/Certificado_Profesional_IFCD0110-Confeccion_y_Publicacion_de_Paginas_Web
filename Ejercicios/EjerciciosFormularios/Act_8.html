<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Actividad Formularios 8">

    <meta name="description" content="Fernando de Dios Ortega Castro">

    <title>Actividad_Formularios_8</title>

    <link rel="stylesheet" href="Act_8.css">

</head>

<body>
    <form id="Formulario_8" name="Formulario_8" method="post" action="#">
        <h2>Formulario Actividad 8</h2><br>
    
        <fieldset>

            <legend><strong>Formulario de opciones</strong></legend><br>



            <div id="ciclo">
                <input type="radio" name="ciclo" value="ciclosmir" >SMIR  <br>
                <input type="radio" name="ciclo" value="cicloasir">ASIR <br>
                <input type="radio" name="ciclo" value="ciclodam" >DAM  <br>
                <input type="radio" name="ciclo" value="ciclodaw" >DAW  <br>
            </div>

            <br>

            <label for="fecha">Elija una fecha:&nbsp;<br><input type="date" name="fecha"></label>

            <br><br>

            <textarea rows="8" cols="57" placeholder="Inserte aqui el texto"></textarea>   

            <br>
            
        </fieldset>

        <br><br>

        <fieldset>

            <legend><strong>Rellene las opciones siguientes</strong></legend><br>

            <label for="hora">Elija una hora:&nbsp;<br><input type="time" name="hora"></label>


            <br><br>


            <div id="materias">
                <input type="checkbox" name="asignatura" value="asignaturamalengua">Lengua <br> 
                <input type="checkbox" name="asignatura" value="asignaturamatematicas" >Matemáticas  <br>
                <input type="checkbox" name="asignatura" value="asignaturamatehistoria" >Historia  <br>
                <input type="checkbox" name="asignatura" value="asignaturageografia" >Geografía  <br>
            </div>


            <br>


            <label for="color">Elija un color:&nbsp;&nbsp;&nbsp;&nbsp;<input type="color" name="color"></label>

            <br><br>

            <textarea rows="8" cols="57" placeholder="Inserte aqui el texto"></textarea>   

            <br><br>

            <select id="escritorio" name="escritorio">
                <option value="kde">KDE</option>
                <option value="gnome">GNOME</option>
                <option value="Unity">unity</option>
            </select>

            <br><br>

            <label for="nombre">Nombre<br><input type="text" name="nombre"></label><br><br>

            <label for="apellidos">Apellidos<br><input type="text" name="apellidos"></label><br><br>

            <label for="telefono">Telefono<br><input type="text" name="telefono"></label><br><br>

            
        </fieldset>


    </form>
</body>

</html>
