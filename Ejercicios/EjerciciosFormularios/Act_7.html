<!DOCTYPE html>

<body>
    <form id="Formulario_7" name="Formulario_7" method="post" action="#">
        <h2>Formulario Actividad 7</h2><br>
    
        <fieldset>

            <legend><strong>Formulario de opciones</strong></legend><br>

            <label for="color">Elija un color:&nbsp;&nbsp;&nbsp;&nbsp;<input type="color" name="color"></label>

            <br><br>

            <label for="instituto">Instituto&nbsp;&nbsp;<input type="text" name="instituto"></label><br><br>

            <label for="estudios">Estudios elegidos&nbsp;&nbsp;<input type="text" name="estudios"></label><br><br>



            <div id="navegador">
                <input type="radio" name="navegador" value="navegadorfirefox">Firefox <br>
                <input type="radio" name="navegador" value="navegadorchrome" >Chrome <br>
                <input type="radio" name="navegador" value="navegadorOpera" >Opera <br>
                <input type="radio" name="navegador" value="navegadorie" >IE <br>
            </div>

            <br>

            <label for="fichero">Elija un fichero:&nbsp;<br><input type="file" name="fichero" ></label>

            <br><br>

            <label for="hora">Elija una hora:&nbsp;<br><input type="time" name="hora"></label>

            <br><br>
            
            <div id="hardware">
                <input type="checkbox" name="hardware" value="hardwaretarjeta_aceleradora">Tarjeta aceleradora <br>
                <input type="checkbox" name="hardware" value="hardwaremonitor_led" >Monitor LED  <br>
                <input type="checkbox" name="hardware" value="hardwaressd" >SSD  <br>
            </div>

            <br>

            <textarea rows="6" cols="54" placeholder="Inserte aqui el texto"></textarea>   

            
        </fieldset>
        
        <br><br>

        <fieldset>

            <legend><strong>Completar estas opciones</strong></legend><br>


            <div id="navegador_2">
                <input type="radio" name="navegador_2" value="navegadorfirefox">Firefox <br>
                <input type="radio" name="navegador_2" value="navegadorchrome" >Chrome <br>
                <input type="radio" name="navegador_2" value="navegadorOpera" >Opera <br>
                <input type="radio" name="navegador_2" value="navegadorie" >IE <br>
            </div>

            <br><br>

            <label for="fecha">Elija una fecha:&nbsp;<br><input type="date" name="fecha"></label>

            <br><br>

            <label for="instituto">Instituto&nbsp;&nbsp;<input type="text" name="instituto"></label><br><br>

            <label for="estudios">Estudios elegidos&nbsp;&nbsp;<input type="text" name="estudios"></label><br><br>

            <br><br>

            <br><br>

            <br><br>

                <input type="checkbox" name="ciclo" value="ciclodam" >DAM  <br>
                <input type="checkbox" name="ciclo" value="ciclodaw" >DAW  <br>

            <br>
