<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Actividad Formularios 3">

    <meta name="description" content="Fernando de Dios Ortega Castro">

    <title>Actividad_Formularios_3</title>

    <link rel="stylesheet" href="Act_3.css">

</head>

<body>
    <form id="Formulario_3" name="Formulario_3" method="post" action="#">
        <h2>Formulario Actividad 3</h2><br>
    
        <fieldset>

            <legend><strong>Completar</strong></legend><br>

            
            <label for="color">Elija un color:&nbsp;&nbsp;&nbsp;&nbsp;<input type="color" name="color"></label>

            <br><br>

            <textarea rows="6" cols="59" placeholder="Utilice este cuadro para escribir"></textarea>   

            <br><br>


            <div id="sexo">

                <input type="checkbox" name="sexo" id="sexo_1" value="sexohombre">&nbsp;Hombre&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

                <input type="checkbox" name="sexo" id="sexo_2" value="sexomujer">&nbsp;Mujer

            </div>

            <br>

        </fieldset>

        <br><br>
        
        <fieldset>
            <legend><strong>Rellene las opciones siguientes</strong></legend><br>

            <label for="fecha_2">Elija una fecha:&nbsp;<br><input type="date" name="fecha_2"></label>
            <br><br>
            <label for="fichero_1">Elija un fichero:&nbsp;<br><input type="file" name="fichero_2" ></label>

            <br><br>    
            <select name="sexo_multiple" id="sexo_multiple" multiple="multiple" size="4">

                <option value="hombre">Hombre</option>
                
                <option value="mujer">Mujer</option>

            </select>

            <br><br>

        </fieldset>

    </form>
</body>

</html>
