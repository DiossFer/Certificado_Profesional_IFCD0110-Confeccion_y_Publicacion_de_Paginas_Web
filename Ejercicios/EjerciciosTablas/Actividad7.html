<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperaturas</title>
    <link rel="stylesheet" href="Actividad7.css">
</head>
<body>
    <table>
        <caption>
            <strong>Temperaturas</strong>
        </caption>
        <tr>
            <th>Sala</th>
            <th>Temperatura maxima</th>
            <th>Temperatura minima</th>
        </tr>
        <tr>
            <td>Entrada</td>
            <td>12°</td>
            <td>8°</td>
        </tr>
        <tr>
            <td>Zona de espera</td>
            <td>20°</td>
            <td>18°</td>
        </tr>
        <tr>
            <td>Almacen</td>
            <td>17°</td>
            <td>16°</td>
        </tr>
        <tr>
            <td colspan="3"><strong>Valores en Celsius</strong></td>
        </tr>

    </table>
</body>
</html>
